<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Delight</title>
    <style>
        body {
            font-family: 'Arial, sans-serif';
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
        }
        header {
            background-color: #ffcc99;
            padding: 20px;
            text-align: center;
            font-size: 2em;
            color: #fff;
            animation: fadeIn 2s ease-in-out;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .product {
            display: inline-block;
            margin: 20px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .product:hover {
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>Welcome to Bakery Delight</header>
    <div class="container">
        <div class="product">
            <h2>Chocolate Cake</h2>
            <p>Delicious and rich chocolate cake.</p>
        </div>
        <div class="product">
            <h2>Blueberry Muffin</h2>
            <p>Freshly baked blueberry muffins.</p>
        </div>
        <div class="product">
            <h2>Croissant</h2>
            <p>Flaky and buttery croissants.</p>
        </div>
    </div>
</body>
</html>
